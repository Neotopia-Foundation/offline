name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check code blocks, private data and prose rules
        run: python3 tools/check_composer.py neotopia-offline.md
