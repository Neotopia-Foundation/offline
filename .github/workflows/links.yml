name: links
on:
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check links in the composer
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2
        with:
          args: >-
            --no-progress --max-concurrency 4 --timeout 30 --retry-wait-time 10
            --accept 200..=299,403,429
            --exclude '<' --exclude 'localhost' --exclude '127\.0\.0\.1'
            neotopia-offline.md README.md README.pl.md
          output: ./lychee/report.md
          fail: false
      - name: Open an issue with broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd  # v5
        with:
          title: Broken links found by the weekly check
          content-filepath: ./lychee/report.md
          labels: links
